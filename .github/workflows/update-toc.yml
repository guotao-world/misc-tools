name: Update README TOC

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-toc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate TOC
        run: python scripts/generate_toc.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README.md unchanged, nothing to commit."
          else
            echo "README.md changed, committing..."
            git add README.md
            git commit -m "update README toc [skip ci]"
            git push origin main
            echo "README.md committed and pushed."
          fi
